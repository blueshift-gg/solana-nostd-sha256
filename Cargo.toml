[package]
name = "solana-nostd-sha256"
authors = ["Dean Little <@deanmlittle>"]
description = "A more efficient, no_std implementation of SHA-256 for the Solana SVM"
license = "MIT"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/blueshift-gg/solana-nostd-sha256"
readme = "Readme.md"
keywords = ["solana", "sbpf", "sha256", "no-std", "crypto"]
categories = ["cryptography", "no-std"]
exclude = [".github/", ".gitignore"]

[lib]

[dev-dependencies]
svm-unit-test = "0.1.5"

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = { version = "0.10.8", default-features = false }